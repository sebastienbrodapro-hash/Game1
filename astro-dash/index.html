<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1026">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Astro Dash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="score">0</div>
    <button id="mute" aria-label="Couper le son">🔊</button>
  </div>

  <div id="menu" class="overlay">
    <h1>ASTRO<span>DASH</span></h1>
    <p class="tagline">Cours, saute, survis.</p>
    <div class="best">Record&nbsp;: <span id="menu-best">0</span></div>
    <button id="play" class="big-btn">JOUER</button>
    <p class="help">Tape l'écran pour sauter<br>Re-tape en l'air pour un double saut</p>
  </div>

  <div id="gameover" class="overlay hidden">
    <h2>PERDU&nbsp;!</h2>
    <div class="final">
      <div>Score&nbsp;: <span id="final-score">0</span></div>
      <div>Record&nbsp;: <span id="final-best">0</span></div>
      <div id="new-record" class="hidden">★ Nouveau record&nbsp;! ★</div>
    </div>
    <button id="retry" class="big-btn">REJOUER</button>
  </div>

  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
